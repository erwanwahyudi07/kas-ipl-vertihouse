<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Portal Satpam - Vertihouse Sawangan II</title>
<meta name="theme-color" content="#0F4C6E" />
<link rel="manifest" href="./manifest-satpam.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F3F6FA;
    --card:#FFFFFF;
    --blue-900:#0A3A54;
    --blue-700:#0F4C6E;
    --blue-600:#15668F;
    --blue-100:#DCEBF4;
    --green-600:#1D9E75;
    --green-100:#E1F5EE;
    --text-1:#16232B;
    --text-2:#5C6E78;
    --text-muted:#94A5AD;
    --border:#DCE6EC;
    font-family:"Plus Jakarta Sans", -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text-1);
    padding-bottom:calc(env(safe-area-inset-bottom) + 24px);
    -webkit-tap-highlight-color:transparent;
  }
  .mono{font-family:"JetBrains Mono", monospace;}

  header{
    padding:calc(env(safe-area-inset-top) + 18px) 20px 16px;
    display:flex; align-items:center; gap:12px;
    background:var(--blue-700); color:#fff;
    position:sticky; top:0; z-index:20;
  }
  header h1{font-size:16px; font-weight:700; margin:0;}
  header p{font-size:12px; margin:2px 0 0; color:rgba(255,255,255,0.75);}

  main{padding:18px 20px 8px;}

  .info-card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px; margin-bottom:16px; text-align:center;
  }
  .info-card .label{font-size:12px; color:var(--text-muted); margin:0 0 4px;}
  .info-card .nama{font-size:18px; font-weight:700; margin:0;}

  .section-title{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--text-muted); margin:16px 2px 10px;
  }

  .shift-toggle-btn{
    width:100%; border:none; border-radius:14px; padding:22px 10px; font-size:16px; font-weight:700;
    color:#fff; font-family:inherit; margin-bottom:8px;
  }
  .shift-toggle-btn.masuk{background:var(--green-600);}
  .shift-toggle-btn.keluar{background:#B7452F;}
  .shift-toggle-btn:active{opacity:0.85;}
  .shift-toggle-btn:disabled{background:var(--border); color:var(--text-muted); opacity:0.7;}
  .durasi-jaga{
    text-align:center; font-size:13px; color:var(--text-2); font-weight:600;
    margin-bottom:12px; display:none;
  }
  .durasi-jaga .mono{font-size:14px; color:var(--text-1);}
  .shift-status{
    display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted);
    padding:0 4px; margin-bottom:20px;
  }
  .shift-status b{color:var(--text-1);}

  .izin-btn{
    width:100%; background:var(--card); border:1.5px solid var(--border); border-radius:14px;
    padding:14px 10px; font-size:14px; font-weight:600; color:var(--text-1); font-family:inherit;
  }
  .izin-btn:active{background:var(--bg);}
  .izin-form textarea{
    width:100%; border:1px solid var(--border); border-radius:12px; padding:10px 12px;
    font-family:inherit; font-size:16px; color:var(--text-1); resize:vertical; margin-top:10px;
    box-sizing:border-box;
  }
  .izin-kirim-btn{
    width:100%; border:none; border-radius:12px; padding:12px; margin-top:8px;
    background:var(--blue-700); color:#fff; font-size:13.5px; font-weight:600; font-family:inherit;
  }
  .izin-kirim-btn:active{opacity:0.85;}

  .toast{
    position:fixed; left:20px; right:20px; bottom:24px;
    background:var(--green-600); color:#fff; padding:14px 18px; border-radius:14px;
    font-size:13.5px; font-weight:600; text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.18);
    opacity:0; transform:translateY(12px); transition:opacity 0.25s, transform 0.25s;
    pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  .riwayat-item{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; font-size:13px;
  }
  .riwayat-item .jenis{font-weight:600;}
  .riwayat-item .jenis.masuk{color:var(--green-600);}
  .riwayat-item .jenis.keluar{color:#B7452F;}
  .riwayat-item .jenis.izin{color:#9A5B0E;}
  .riwayat-item .waktu-wrap{text-align:right;}
  .riwayat-item .waktu{color:var(--text-1); font-size:13px; font-weight:600;}
  .riwayat-item .tanggal{color:var(--text-muted); font-size:11px;}

  .empty{text-align:center; color:var(--text-muted); font-size:13px; padding:16px 0;}
</style>
</head>
<body>

<header>
  <div>
    <h1>🚶 Portal Satpam</h1>
    <p>Vertihouse Sawangan II · Absensi Jaga</p>
  </div>
</header>

<main>
  <div class="info-card">
    <p class="label">Petugas terdaftar sedang bertugas</p>
    <p class="nama" id="nama-petugas">Memuat...</p>
  </div>

  <p class="section-title">Mulai / Selesai Jaga</p>
  <div class="durasi-jaga" id="durasi-jaga">Sudah bertugas: <span class="mono" id="durasi-teks">00:00:00</span></div>
  <button class="shift-toggle-btn masuk" id="btn-shift-toggle">Mulai Jaga</button>
  <div class="shift-status">
    <span>Masuk: <b id="jam-masuk">-</b></span>
    <span>Keluar: <b id="jam-keluar">-</b></span>
  </div>

  <p class="section-title">Berhalangan / Tidak Bisa Masuk</p>
  <button class="izin-btn" id="btn-buka-izin">Ajukan Izin / Berhalangan</button>
  <div class="izin-form" id="izin-form" style="display:none;">
    <textarea id="izin-alasan" rows="3" placeholder="Tulis alasan (misal: sakit, keperluan keluarga)..."></textarea>
    <button class="izin-kirim-btn" id="btn-kirim-izin">Kirim Izin</button>
  </div>

  <p class="section-title">Riwayat Absensi Terakhir</p>
  <div id="riwayat-list"><p class="empty">Memuat...</p></div>
</main>

<div class="toast" id="toast"></div>

<script src="./config.js"></script>
<script>
  let namaPetugasSaatIni = "Petugas";

  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }

  function fmtTanggalPendek(d){
    return new Date(d).toLocaleDateString("id-ID", { day: "numeric", month: "short" });
  }

  function renderRiwayat(list){
    const el = document.getElementById("riwayat-list");
    if(!list || list.length === 0){
      el.innerHTML = '<p class="empty">Belum ada absensi tercatat.</p>';
      return;
    }
    el.innerHTML = list.slice(0, 8).map(r => {
      const parts = (r.waktu || "").split(" ");
      const tanggal = parts[0] ? fmtTanggalPendek(parts[0]) : "";
      const jam = parts[1] || r.waktu || "-";

      let jenisLabel, jenisClass, icon;
      if(r.jenis === "Izin"){
        jenisLabel = `Izin · Shift ${r.shift || "-"} · ${r.nama || "-"}`;
        jenisClass = "izin";
        icon = "🟡";
      } else {
        const isMasuk = r.jenis === "Masuk";
        jenisLabel = `${r.jenis} · ${r.nama || "-"}`;
        jenisClass = isMasuk ? "masuk" : "keluar";
        icon = isMasuk ? "🟢" : "🔴";
      }

      return `
      <div class="riwayat-item">
        <span class="jenis ${jenisClass}">${icon} ${jenisLabel}</span>
        <span class="waktu-wrap">
          <div class="waktu">${jam}</div>
          <div class="tanggal">${tanggal}</div>
        </span>
      </div>`;
    }).join("");
  }

  let sedangBertugasSaatIni = false;
  let durasiInterval = null;

  function pad2(n){ return String(n).padStart(2, "0"); }

  function mulaiTimerDurasi(masukTimestamp){
    clearInterval(durasiInterval);
    const wrap = document.getElementById("durasi-jaga");
    const teks = document.getElementById("durasi-teks");
    wrap.style.display = "block";

    function update(){
      const diff = Math.max(0, Date.now() - masukTimestamp);
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      teks.textContent = `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
    }
    update();
    durasiInterval = setInterval(update, 1000);
  }

  function hentikanTimerDurasi(){
    clearInterval(durasiInterval);
    document.getElementById("durasi-jaga").style.display = "none";
  }

  async function loadInfo(){
    const usingDemo = !CONFIG.API_URL || CONFIG.API_URL.includes("PASTE_URL");
    const btnToggle = document.getElementById("btn-shift-toggle");

    if(usingDemo){
      document.getElementById("nama-petugas").textContent = "Mode demo";
      renderRiwayat([]);
      return;
    }
    try{
      const res = await fetch(CONFIG.API_URL, { cache:"no-store" });
      const data = await res.json();
      const jadwal = data.jadwalJaga;
      const shift = data.shiftHariIni || {};

      if(jadwal && jadwal.izinAktif){
        namaPetugasSaatIni = jadwal.izinAktif.nama || "Tidak diketahui";
        document.getElementById("nama-petugas").textContent = `${namaPetugasSaatIni} (berhalangan, shift kosong)`;
        btnToggle.disabled = true;
        btnToggle.textContent = "Shift Kosong";
        btnToggle.className = "shift-toggle-btn masuk";
        hentikanTimerDurasi();
      } else {
        namaPetugasSaatIni = (jadwal && jadwal.petugasAktif && jadwal.petugasAktif.nama) || "Tidak diketahui";
        document.getElementById("nama-petugas").textContent = namaPetugasSaatIni;
        btnToggle.disabled = false;

        sedangBertugasSaatIni = !!shift.sedangBertugas;
        if(sedangBertugasSaatIni){
          btnToggle.textContent = "Selesai Jaga";
          btnToggle.className = "shift-toggle-btn keluar";
          mulaiTimerDurasi(shift.masukTimestamp || Date.now());
        } else {
          btnToggle.textContent = "Mulai Jaga";
          btnToggle.className = "shift-toggle-btn masuk";
          hentikanTimerDurasi();
        }
      }

      renderRiwayat(data.shiftTerakhir);

      document.getElementById("jam-masuk").textContent = shift.masuk ? shift.masuk.waktu : "-";
      document.getElementById("jam-keluar").textContent = shift.keluar ? shift.keluar.waktu : "-";
    }catch(err){
      document.getElementById("nama-petugas").textContent = "Gagal memuat";
    }
  }

  async function checkInOutShift(){
    const jenis = sedangBertugasSaatIni ? "Keluar" : "Masuk";
    if(!CONFIG.API_URL || CONFIG.API_URL.includes("PASTE_URL")){
      showToast("Mode demo - belum terhubung ke Apps Script");
      return;
    }
    try{
      await fetch(CONFIG.API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ jenis: jenis })
      });
      showToast(jenis === "Masuk" ? "Mulai jaga tercatat" : "Selesai jaga tercatat");
      loadInfo();
    }catch(err){
      showToast("Gagal mencatat, coba lagi");
    }
  }

  document.getElementById("btn-shift-toggle").addEventListener("click", () => checkInOutShift());

  document.getElementById("btn-buka-izin").addEventListener("click", () => {
    const form = document.getElementById("izin-form");
    form.style.display = form.style.display === "none" ? "block" : "none";
  });

  document.getElementById("btn-kirim-izin").addEventListener("click", async () => {
    const alasan = document.getElementById("izin-alasan").value.trim();
    if(!alasan){
      showToast("Tulis alasan dulu ya");
      return;
    }
    if(!CONFIG.API_URL || CONFIG.API_URL.includes("PASTE_URL")){
      showToast("Mode demo - belum terhubung ke Apps Script");
      return;
    }
    try{
      await fetch(CONFIG.API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ type: "izin", alasan: alasan })
      });
      showToast("Izin tercatat, warga akan bisa melihatnya");
      document.getElementById("izin-alasan").value = "";
      document.getElementById("izin-form").style.display = "none";
      loadInfo();
    }catch(err){
      showToast("Gagal mengirim, coba lagi");
    }
  });

  loadInfo();

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
  }
</script>
</body>
</html>
