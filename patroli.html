<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Portal Satpam - Vertihouse Sawangan II</title>
<meta name="theme-color" content="#0F4C6E" />
<link rel="manifest" href="./manifest-satpam.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F3F6FA;
    --card:#FFFFFF;
    --blue-900:#0A3A54;
    --blue-700:#0F4C6E;
    --blue-600:#15668F;
    --blue-100:#DCEBF4;
    --green-600:#1D9E75;
    --green-100:#E1F5EE;
    --amber-700:#9A5B0E;
    --amber-100:#FDEBD3;
    --text-1:#16232B;
    --text-2:#5C6E78;
    --text-muted:#94A5AD;
    --border:#DCE6EC;
    font-family:"Plus Jakarta Sans", -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text-1);
    padding-bottom:calc(env(safe-area-inset-bottom) + 24px);
    -webkit-tap-highlight-color:transparent;
  }
  .mono{font-family:"JetBrains Mono", monospace;}

  header{
    padding:calc(env(safe-area-inset-top) + 18px) 20px 16px;
    display:flex; align-items:center; gap:12px;
    background:var(--blue-700); color:#fff;
    position:sticky; top:0; z-index:20;
  }
  header h1{font-size:16px; font-weight:700; margin:0;}
  header p{font-size:12px; margin:2px 0 0; color:rgba(255,255,255,0.75);}

  .reload-btn{
    width:36px; height:36px; border-radius:10px; border:none;
    background:rgba(255,255,255,0.15); color:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; margin-left:auto;
  }
  .reload-btn svg{width:18px; height:18px;}
  .reload-btn.spin svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  main{padding:18px 20px 8px;}

  .info-card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px; margin-bottom:16px; text-align:center;
  }
  .info-card .label{font-size:12px; color:var(--text-muted); margin:0 0 4px;}
  .info-card .nama{font-size:17px; font-weight:700; margin:0;}

  .section-title{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--text-muted); margin:16px 2px 10px;
  }

  .carryover-notice{
    background:var(--amber-100); color:var(--amber-700); font-size:12px;
    padding:10px 12px; border-radius:10px; margin-bottom:10px; line-height:1.5;
  }

  .shift-toggle-btn{
    width:100%; border:none; border-radius:14px; padding:18px 10px; font-size:14.5px; font-weight:700;
    color:#fff; font-family:inherit; margin-bottom:8px; text-align:center;
  }
  .shift-toggle-btn .sub{display:block; font-weight:400; font-size:11.5px; margin-top:2px; opacity:0.85;}
  .shift-toggle-btn.masuk{background:var(--green-600);}
  .shift-toggle-btn.keluar{background:#B7452F;}
  .shift-toggle-btn:active{opacity:0.85;}
  .shift-toggle-btn:disabled{background:var(--border); color:var(--text-muted); opacity:0.7;}
  .durasi-jaga{
    text-align:center; font-size:13px; color:var(--text-2); font-weight:600;
    margin-bottom:12px; display:none;
  }
  .durasi-jaga .mono{font-size:14px; color:var(--text-1);}

  .izin-btn{
    width:100%; background:var(--card); border:1.5px solid var(--border); border-radius:14px;
    padding:14px 10px; font-size:14px; font-weight:600; color:var(--text-1); font-family:inherit;
  }
  .izin-btn:active{background:var(--bg);}
  .izin-btn:disabled{opacity:0.6;}
  .izin-form textarea{
    width:100%; border:1px solid var(--border); border-radius:12px; padding:10px 12px;
    font-family:inherit; font-size:16px; color:var(--text-1); resize:vertical; margin-top:10px;
    box-sizing:border-box;
  }
  .izin-kirim-btn{
    width:100%; border:none; border-radius:12px; padding:12px; margin-top:8px;
    background:var(--blue-700); color:#fff; font-size:13.5px; font-weight:600; font-family:inherit;
  }
  .izin-kirim-btn:active{opacity:0.85;}
  .izin-kirim-btn:disabled{opacity:0.6;}

  .toast{
    position:fixed; left:20px; right:20px; bottom:24px;
    background:var(--green-600); color:#fff; padding:14px 18px; border-radius:14px;
    font-size:13.5px; font-weight:600; text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.18);
    opacity:0; transform:translateY(12px); transition:opacity 0.25s, transform 0.25s;
    pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  .riwayat-item{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; font-size:13px;
  }
  .riwayat-item .jenis{font-weight:600;}
  .riwayat-item .jenis.masuk{color:var(--green-600);}
  .riwayat-item .jenis.keluar{color:#B7452F;}
  .riwayat-item .waktu{color:var(--text-muted); font-size:12px;}

  .empty{text-align:center; color:var(--text-muted); font-size:13px; padding:16px 0;}
</style>
</head>
<body>

<header>
  <div>
    <h1>🚶 Portal Satpam</h1>
    <p>Vertihouse Sawangan II · Absensi Jaga</p>
  </div>
  <button class="reload-btn" id="reload-btn" aria-label="Muat ulang">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
  </button>
</header>

<main>
  <div class="info-card">
    <p class="label">Status saat ini</p>
    <p class="nama" id="nama-petugas">Memuat...</p>
  </div>

  <p class="section-title">Mulai / Selesai Jaga</p>
  <div class="durasi-jaga" id="durasi-jaga">Sudah bertugas: <span class="mono" id="durasi-teks">00:00:00</span></div>
  <div class="carryover-notice" id="carryover-notice" style="display:none;"></div>
  <div id="tombol-jaga"></div>

  <p class="section-title">Berhalangan / Tidak Bisa Masuk</p>
  <button class="izin-btn" id="btn-buka-izin">Ajukan Izin / Berhalangan</button>
  <div class="izin-form" id="izin-form" style="display:none;">
    <textarea id="izin-alasan" rows="3" placeholder="Tulis alasan (misal: sakit, keperluan keluarga)..."></textarea>
    <button class="izin-kirim-btn" id="btn-kirim-izin">Kirim Izin</button>
  </div>

  <p class="section-title">Riwayat Absensi Terakhir</p>
  <div id="riwayat-list"><p class="empty">Memuat...</p></div>
</main>

<div class="toast" id="toast"></div>

<script src="./config.js"></script>
<script>
  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }

  function renderRiwayat(list){
    const el = document.getElementById("riwayat-list");
    if(!list || list.length === 0){
      el.innerHTML = '<p class="empty">Belum ada absensi tercatat.</p>';
      return;
    }
    el.innerHTML = list.slice(0, 8).map(r => {
      const isMasuk = r.jenis === "Masuk";
      return `
      <div class="riwayat-item">
        <span class="jenis ${isMasuk ? "masuk" : "keluar"}">${r.jenis} · ${r.nama || "-"}</span>
        <span class="waktu">${(r.waktu || "").split(" ")[1] || r.waktu}</span>
      </div>`;
    }).join("");
  }

  let durasiInterval = null;

  function pad2(n){ return String(n).padStart(2, "0"); }

  function mulaiTimerDurasi(masukTimestamp){
    clearInterval(durasiInterval);
    const wrap = document.getElementById("durasi-jaga");
    const teks = document.getElementById("durasi-teks");
    wrap.style.display = "block";

    function update(){
      const diff = Math.max(0, Date.now() - masukTimestamp);
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      teks.textContent = `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
    }
    update();
    durasiInterval = setInterval(update, 1000);
  }

  function hentikanTimerDurasi(){
    clearInterval(durasiInterval);
    document.getElementById("durasi-jaga").style.display = "none";
  }

  async function loadInfo(){
    const reloadBtn = document.getElementById("reload-btn");
    reloadBtn.classList.add("spin");
    const usingDemo = !CONFIG.API_URL || CONFIG.API_URL.includes("PASTE_URL");

    const container = document.getElementById("tombol-jaga");
    const carryoverNotice = document.getElementById("carryover-notice");
    const namaEl = document.getElementById("nama-petugas");

    if(usingDemo){
      namaEl.textContent = "Mode demo";
      renderRiwayat([]);
      reloadBtn.classList.remove("spin");
      return;
    }
    try{
      const res = await fetch(CONFIG.API_URL, { cache:"no-store" });
      const data = await res.json();
      const jadwal = data.jadwalJaga || {};
      const shift = data.shiftHariIni || {};

      const izin = jadwal.izinAktif || null;
      const scheduledName = (jadwal.petugasAktif && jadwal.petugasAktif.nama) || null;
      const berikutnya = jadwal.petugasBerikutnya || null;
      const openList = shift.openList || [];

      container.innerHTML = "";
      carryoverNotice.style.display = "none";
      hentikanTimerDurasi();

      const scheduledOpen = openList.find(o => o.nama === scheduledName);
      const isSingleNormal = openList.length === 1 && scheduledOpen;

      let html = "";

      if(openList.length === 0 && izin){
        namaEl.textContent = `${izin.nama || "Tidak diketahui"} (berhalangan, shift kosong)`;
        html = '<button class="shift-toggle-btn masuk" disabled>Shift Kosong</button>';
      } else if(openList.length === 0 && !scheduledName){
        namaEl.textContent = "Tidak ada jadwal";
        html = '<button class="shift-toggle-btn masuk" disabled>Tidak Ada Jadwal</button>';
      } else if(openList.length === 0 && scheduledName){
        namaEl.textContent = scheduledName;
        html = `<button class="shift-toggle-btn masuk" data-jenis="Masuk" data-nama="${scheduledName}">Mulai Jaga — ${scheduledName}</button>`;
      } else if(isSingleNormal){
        namaEl.textContent = scheduledName;
        mulaiTimerDurasi(scheduledOpen.timestamp);
        html = `<button class="shift-toggle-btn keluar" data-jenis="Keluar" data-nama="${scheduledName}">Selesai Jaga — ${scheduledName}<span class="sub">sejak ${scheduledOpen.waktu}</span></button>`;
      } else {
        const namaList = openList.map(o => o.nama).join(", ");
        namaEl.textContent = `${namaList} (belum check-out)`;
        carryoverNotice.style.display = "block";
        carryoverNotice.textContent = `${namaList} masih tercatat bertugas. Pastikan tekan tombol sesuai nama Anda sendiri.`;

        openList.forEach(o => {
          html += `<button class="shift-toggle-btn keluar" data-jenis="Keluar" data-nama="${o.nama}">Selesai Jaga — ${o.nama}<span class="sub">sejak ${o.waktu}</span></button>`;
        });
        if(scheduledName && !scheduledOpen){
          html += `<button class="shift-toggle-btn masuk" data-jenis="Masuk" data-nama="${scheduledName}">Mulai Jaga — ${scheduledName}</button>`;
        }
      }

      const berikutnyaSudahOpen = berikutnya && openList.some(o => o.nama === berikutnya.nama);
      const berikutnyaSamaScheduled = berikutnya && scheduledName && berikutnya.nama === scheduledName;
      if(berikutnya && !berikutnyaSudahOpen && !berikutnyaSamaScheduled){
        html += `<button class="shift-toggle-btn masuk" data-jenis="Masuk" data-nama="${berikutnya.nama}">Mulai Jaga — ${berikutnya.nama}<span class="sub">shift berikutnya, boleh check-in lebih awal</span></button>`;
      }

      container.innerHTML = html;

      renderRiwayat(data.shiftTerakhir);
    }catch(err){
      namaEl.textContent = "Gagal memuat";
    }finally{
      reloadBtn.classList.remove("spin");
    }
  }

  let sedangKirimJaga = false;

  async function checkInOutShift(jenis, nama){
    if(sedangKirimJaga) return;
    if(!CONFIG.API_URL || CONFIG.API_URL.includes("PASTE_URL")){
      showToast("Mode demo - belum terhubung ke Apps Script");
      return;
    }
    sedangKirimJaga = true;
    document.querySelectorAll("#tombol-jaga button").forEach(b => b.disabled = true);
    try{
      await fetch(CONFIG.API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ jenis: jenis, nama: nama })
      });
      showToast(jenis === "Masuk" ? "Mulai jaga tercatat" : "Selesai jaga tercatat");
    }catch(err){
      showToast("Gagal mencatat, coba lagi");
    }finally{
      sedangKirimJaga = false;
      loadInfo();
    }
  }

  document.getElementById("tombol-jaga").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-jenis]");
    if(!btn || btn.disabled) return;
    checkInOutShift(btn.dataset.jenis, btn.dataset.nama);
  });

  document.getElementById("reload-btn").addEventListener("click", loadInfo);

  document.getElementById("btn-buka-izin").addEventListener("click", () => {
    const form = document.getElementById("izin-form");
    form.style.display = form.style.display === "none" ? "block" : "none";
  });

  let sedangKirimIzin = false;

  document.getElementById("btn-kirim-izin").addEventListener("click", async () => {
    if(sedangKirimIzin) return;
    const alasan = document.getElementById("izin-alasan").value.trim();
    if(!alasan){
      showToast("Tulis alasan dulu ya");
      return;
    }
    if(!CONFIG.API_URL || CONFIG.API_URL.includes("PASTE_URL")){
      showToast("Mode demo - belum terhubung ke Apps Script");
      return;
    }
    sedangKirimIzin = true;
    const btnKirim = document.getElementById("btn-kirim-izin");
    btnKirim.disabled = true;
    try{
      await fetch(CONFIG.API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ type: "izin", alasan: alasan })
      });
      showToast("Izin tercatat, warga akan bisa melihatnya");
      document.getElementById("izin-alasan").value = "";
      document.getElementById("izin-form").style.display = "none";
      loadInfo();
    }catch(err){
      showToast("Gagal mengirim, coba lagi");
    }finally{
      sedangKirimIzin = false;
      btnKirim.disabled = false;
    }
  });

  loadInfo();

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
  }
</script>
</body>
</html>
