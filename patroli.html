<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Portal Satpam - Vertihouse Sawangan II</title>
<meta name="theme-color" content="#0F4C6E" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F3F6FA;
    --card:#FFFFFF;
    --blue-900:#0A3A54;
    --blue-700:#0F4C6E;
    --blue-600:#15668F;
    --blue-100:#DCEBF4;
    --green-600:#1D9E75;
    --green-100:#E1F5EE;
    --text-1:#16232B;
    --text-2:#5C6E78;
    --text-muted:#94A5AD;
    --border:#DCE6EC;
    font-family:"Plus Jakarta Sans", -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text-1);
    padding-bottom:calc(env(safe-area-inset-bottom) + 24px);
    -webkit-tap-highlight-color:transparent;
  }
  .mono{font-family:"JetBrains Mono", monospace;}

  header{
    padding:calc(env(safe-area-inset-top) + 18px) 20px 16px;
    display:flex; align-items:center; gap:12px;
    background:var(--blue-700); color:#fff;
    position:sticky; top:0; z-index:20;
  }
  .back-btn{
    width:36px; height:36px; border-radius:10px; border:none;
    background:rgba(255,255,255,0.15); color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .back-btn svg{width:18px; height:18px;}
  header h1{font-size:16px; font-weight:700; margin:0;}
  header p{font-size:12px; margin:2px 0 0; color:rgba(255,255,255,0.75);}

  main{padding:18px 20px 8px;}

  .info-card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px; margin-bottom:16px; text-align:center;
  }
  .info-card .label{font-size:12px; color:var(--text-muted); margin:0 0 4px;}
  .info-card .nama{font-size:18px; font-weight:700; margin:0;}

  .section-title{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--text-muted); margin:16px 2px 10px;
  }

  .area-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:20px;}
  .area-btn{
    background:var(--card); border:1.5px solid var(--border); border-radius:14px;
    padding:16px 8px; font-size:15px; font-weight:700; color:var(--blue-700);
    font-family:inherit;
  }
  .area-btn:active{background:var(--blue-100); border-color:var(--blue-600);}

  .shift-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px;}
  .shift-btn{
    border:none; border-radius:14px; padding:16px 10px; font-size:14px; font-weight:700;
    color:#fff; font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .shift-btn.masuk{background:var(--green-600);}
  .shift-btn.keluar{background:#B7452F;}
  .shift-btn:active{opacity:0.85;}
  .shift-status{
    display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted);
    padding:0 4px; margin-bottom:20px;
  }
  .shift-status b{color:var(--text-1);}

  .toast{
    position:fixed; left:20px; right:20px; bottom:24px;
    background:var(--green-600); color:#fff; padding:14px 18px; border-radius:14px;
    font-size:13.5px; font-weight:600; text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.18);
    opacity:0; transform:translateY(12px); transition:opacity 0.25s, transform 0.25s;
    pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  .riwayat-item{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; font-size:13px;
  }
  .riwayat-item .area{font-weight:600;}
  .riwayat-item .waktu{color:var(--text-muted); font-size:12px;}

  .empty{text-align:center; color:var(--text-muted); font-size:13px; padding:16px 0;}
</style>
</head>
<body>

<header>
  <div>
    <h1>🚶 Portal Satpam</h1>
    <p>Vertihouse Sawangan II · Check-in Ronda &amp; Shift</p>
  </div>
</header>

<main>
  <div class="info-card">
    <p class="label">Petugas terdaftar sedang bertugas</p>
    <p class="nama" id="nama-petugas">Memuat...</p>
  </div>

  <p class="section-title">Mulai / Selesai Jaga</p>
  <div class="shift-grid">
    <button class="shift-btn masuk" id="btn-masuk">🟢 Mulai Jaga</button>
    <button class="shift-btn keluar" id="btn-keluar">🔴 Selesai Jaga</button>
  </div>
  <div class="shift-status">
    <span>Masuk: <b id="jam-masuk">-</b></span>
    <span>Keluar: <b id="jam-keluar">-</b></span>
  </div>

  <p class="section-title">Tap blok yang baru selesai dironda</p>
  <div class="area-grid" id="area-grid">
    <button class="area-btn" data-area="Blok A">Blok A</button>
    <button class="area-btn" data-area="Blok B">Blok B</button>
    <button class="area-btn" data-area="Blok C">Blok C</button>
    <button class="area-btn" data-area="Blok D">Blok D</button>
    <button class="area-btn" data-area="Blok E">Blok E</button>
    <button class="area-btn" data-area="Blok F">Blok F</button>
    <button class="area-btn" data-area="Blok G">Blok G</button>
    <button class="area-btn" data-area="Gerbang / Pos Jaga">Gerbang</button>
    <button class="area-btn" data-area="Keliling Umum">Keliling</button>
  </div>

  <p class="section-title">Check-in Terakhir</p>
  <div id="riwayat-list"><p class="empty">Memuat...</p></div>
</main>

<div class="toast" id="toast"></div>

<script src="./config.js"></script>
<script>
  let namaPetugasSaatIni = "Petugas";

  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }

  function renderRiwayat(list){
    const el = document.getElementById("riwayat-list");
    if(!list || list.length === 0){
      el.innerHTML = '<p class="empty">Belum ada check-in tercatat.</p>';
      return;
    }
    el.innerHTML = list.slice(0, 8).map(r => `
      <div class="riwayat-item">
        <span class="area">${r.area || "-"} · ${r.nama || "-"}</span>
        <span class="waktu">${r.waktu.split(" ")[1] || r.waktu}</span>
      </div>`).join("");
  }

  async function loadInfo(){
    const usingDemo = !CONFIG.API_URL || CONFIG.API_URL.includes("PASTE_URL");
    if(usingDemo){
      document.getElementById("nama-petugas").textContent = "Mode demo";
      renderRiwayat([]);
      return;
    }
    try{
      const res = await fetch(CONFIG.API_URL, { cache:"no-store" });
      const data = await res.json();
      const jadwal = data.jadwalJaga;
      namaPetugasSaatIni = (jadwal && jadwal.petugasAktif && jadwal.petugasAktif.nama) || "Tidak diketahui";
      document.getElementById("nama-petugas").textContent = namaPetugasSaatIni;
      renderRiwayat(data.patroliTerakhir);

      const shift = data.shiftHariIni || {};
      document.getElementById("jam-masuk").textContent = shift.masuk ? shift.masuk.waktu : "-";
      document.getElementById("jam-keluar").textContent = shift.keluar ? shift.keluar.waktu : "-";
    }catch(err){
      document.getElementById("nama-petugas").textContent = "Gagal memuat";
    }
  }

  async function checkInOutShift(jenis){
    if(!CONFIG.API_URL || CONFIG.API_URL.includes("PASTE_URL")){
      showToast("Mode demo - belum terhubung ke Apps Script");
      return;
    }
    try{
      await fetch(CONFIG.API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ type: "shift", jenis: jenis })
      });
      showToast(jenis === "Masuk" ? "🟢 Mulai jaga tercatat" : "🔴 Selesai jaga tercatat");
      loadInfo();
    }catch(err){
      showToast("Gagal mencatat, coba lagi");
    }
  }

  document.getElementById("btn-masuk").addEventListener("click", () => checkInOutShift("Masuk"));
  document.getElementById("btn-keluar").addEventListener("click", () => checkInOutShift("Keluar"));

  async function checkIn(area){
    if(!CONFIG.API_URL || CONFIG.API_URL.includes("PASTE_URL")){
      showToast("Mode demo - belum terhubung ke Apps Script");
      return;
    }
    try{
      await fetch(CONFIG.API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ area: area })
      });
      showToast(`✓ Ronda "${area}" tercatat`);
      loadInfo();
    }catch(err){
      showToast("Gagal mencatat, coba lagi");
    }
  }

  document.getElementById("area-grid").addEventListener("click", (e) => {
    const btn = e.target.closest(".area-btn");
    if(!btn) return;
    checkIn(btn.dataset.area);
  });

  loadInfo();

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
  }
</script>
</body>
</html>
